{% extends "base.html" %}

{% block title %}Supprimer le modèle{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto space-y-6">

<h2 class="text-2xl font-bold text-red-600">Supprimer le modèle</h2>

<div class="bg-white border shadow rounded-lg p-6 space-y-5">
<div>
<p class="font-semibold text-gray-900">{{ template.name }}</p>
<p class="text-sm text-gray-600 whitespace-pre-line mt-2">{{ template.message }}</p>
</div>

<form method="POST" class="flex flex-col gap-3 sm:flex-row">
{% csrf_token %}
<button type="submit"
        class="inline-flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg">
    <i data-lucide="trash-2" class="w-4 h-4"></i>
    Supprimer
</button>

<a href="{% url 'message_templates_list' %}"
   class="inline-flex items-center justify-center gap-2 px-6 py-3 border rounded-lg hover:bg-gray-50">
    <i data-lucide="x" class="w-4 h-4"></i>
    Annuler
</a>
</form>
</div>

</div>

{% endblock %}
